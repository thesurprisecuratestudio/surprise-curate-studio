<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Bookings — The Surprise & Curate Studio</title>
<link rel="stylesheet" href="/css/styles.css">
</head>
<body data-page="account">

<div id="site-header"></div>

<section class="section-tight">
  <div class="container" style="max-width:760px">
    <h1 style="font-size:26px;margin:0 0 6px">My Bookings</h1>
    <p class="muted" style="margin:0 0 28px">Track the status of your events with The Surprise &amp; Curate Studio.</p>

    <div id="login-gate" class="form-card text-center" style="display:none">
      <p style="font-weight:700;margin-bottom:16px">Please sign in with Google to view your bookings</p>
      <button id="gate-login-btn" class="btn btn-pink">Sign in with Google</button>
    </div>

    <div id="bookings-list" style="display:none"></div>
  </div>
</section>

<div id="site-footer"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="/js/supabaseClient.js"></script>
<script src="/js/main.js"></script>
<script>
document.addEventListener("scs:partials-ready", async () => {
  await window.scsReady;
  const supabase = window.scsSupabase;
  const { data: { session } } = await supabase.auth.getSession();

  if (!session) {
    document.getElementById("login-gate").style.display = "block";
    document.getElementById("gate-login-btn").addEventListener("click", async () => {
      await supabase.auth.signInWithOAuth({ provider: "google", options: { redirectTo: window.location.href } });
    });
    return;
  }

  const listEl = document.getElementById("bookings-list");
  listEl.style.display = "block";
  listEl.innerHTML = `<div class="panel skeleton" style="height:120px;margin-bottom:16px"></div>`;

  const { data: bookings, error } = await supabase
    .from("bookings")
    .select("*")
    .eq("customer_user_id", session.user.id)
    .order("created_at", { ascending: false });

  if (error || !bookings?.length) {
    listEl.innerHTML = `<div class="panel text-center"><p class="muted">No bookings yet.</p><a href="/booking.html" class="btn btn-pink" style="margin-top:12px">Make Your First Booking</a></div>`;
    return;
  }

  const steps = ["pending", "confirmed", "finished"];
  listEl.innerHTML = bookings.map((b) => {
    const stepIndex = b.booking_status === "cancelled" ? -1 : steps.indexOf(b.booking_status);
    return `
    <div class="panel" style="margin-bottom:18px">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px">
        <div>
          <strong>${b.booking_code}</strong>
          <div class="muted" style="font-size:13px">${b.event_type} · ${b.event_date} at ${b.event_time}</div>
        </div>
        <span class="badge badge-${b.booking_status}">${b.booking_status}</span>
      </div>

      ${b.booking_status !== "cancelled" ? `
      <div class="timeline">
        ${steps.map((s, i) => `
          <div class="tl-step ${i <= stepIndex ? "done" : ""}">
            <div class="tl-dot"></div>
            <div class="tl-label">${s.charAt(0).toUpperCase() + s.slice(1)}</div>
          </div>`).join("")}
      </div>` : `<p style="color:var(--danger);font-weight:700;font-size:13px">This booking was cancelled.</p>`}

      <div style="font-size:13.5px;margin-top:14px;display:grid;gap:6px">
        <div><span class="muted">Venue:</span> ${b.event_venue}</div>
        <div><span class="muted">Magnet Type:</span> ${b.magnet_type} (${b.confirmed_magnet_count} pcs)</div>
        <div><span class="muted">Advance Paid:</span> ₹${b.advance_paid} — <span class="badge badge-${b.payment_status}">${b.payment_status}</span></div>
      </div>
    </div>`;
  }).join("");
});
</script>
</body>
</html>
